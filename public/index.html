<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
        }
        h2 {
            color: #333;
        }
        #upload-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 50%;
            margin: auto;
        }
        input[type="file"] {
            margin: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        #media-container {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .media-item {
            margin: 10px;
            border-radius: 10px;
            overflow: hidden;
            background: white;
            padding: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }
        img, video {
            max-width: 300px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>Upload Images & Videos</h2>

    <div id="upload-container">
        <input type="file" id="mediaInput">
        <button onclick="uploadMedia()">Upload</button>
    </div>

    <div id="media-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", fetchMedia);

        async function uploadMedia() {
            const fileInput = document.getElementById("mediaInput");
            if (!fileInput.files.length) {
                alert("Please select a file!");
                return;
            }

            const formData = new FormData();
            formData.append("media", fileInput.files[0]);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    fileInput.value = ""; // Clear input after upload
                    fetchMedia(); // Refresh media display
                } else {
                    alert("Upload failed!");
                }
            } catch (error) {
                console.error("Error uploading file:", error);
            }
        }

        async function fetchMedia() {
            try {
                const response = await fetch("/media");
                const mediaList = await response.json();
                const mediaContainer = document.getElementById("media-container");
                mediaContainer.innerHTML = "";

                mediaList.forEach(media => {
                    const div = document.createElement("div");
                    div.className = "media-item";
                    
                    if (media.mediaType === "image") {
                        div.innerHTML = `<img src="/${media.filename}" alt="Uploaded Image">`;
                    } else {
                        div.innerHTML = `<video src="/${media.filename}" controls></video>`;
                    }

                    mediaContainer.appendChild(div);
                });
            } catch (error) {
                console.error("Error fetching media:", error);
            }
        }
    </script>

</body>
</html>
