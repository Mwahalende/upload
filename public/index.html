<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload & View Media</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .upload-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: inline-block;
        }
        input {
            margin: 10px;
        }
        button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .media-item {
            width: 300px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }
        .media-item:hover {
            transform: scale(1.05);
        }
        .media-item img, .media-item video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Upload Your Pictures & Videos</h1>

    <div class="upload-container">
        <form id="uploadForm">
            <input type="file" name="media" id="mediaInput" required>
            <button type="submit">Upload</button>
        </form>
    </div>

    <h2>Recent Uploads</h2>
    <div class="gallery" id="gallery"></div>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const formData = new FormData();
            const mediaFile = document.getElementById("mediaInput").files[0];

            if (!mediaFile) return alert("Please select a file");

            formData.append("media", mediaFile);

            const response = await fetch("http://localhost:3000/upload", {
                method: "POST",
                body: formData,
            });

            if (response.ok) {
                const result = await response.json();
                alert("Upload successful!");
                addMediaToPage(result.filename, result.type);
            } else {
                alert("Upload failed");
            }
        });

        async function loadMedia() {
            const response = await fetch("http://localhost:3000/media");
            const mediaList = await response.json();
            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";

            mediaList.forEach((media) => {
                addMediaToPage(media.filename, media.type);
            });
        }

        function addMediaToPage(filename, type) {
            const gallery = document.getElementById("gallery");
            const mediaItem = document.createElement("div");
            mediaItem.classList.add("media-item");

            if (type === "image") {
                mediaItem.innerHTML = `<img src="http://localhost:3000/${filename}" alt="Image">`;
            } else {
                mediaItem.innerHTML = `<video controls>
                    <source src="http://localhost:3000/${filename}" type="video/mp4">
                    Your browser does not support videos.
                </video>`;
            }

            gallery.prepend(mediaItem); // Newest first
        }

        loadMedia(); // Load media on page load
    </script>

</body>
</html>
